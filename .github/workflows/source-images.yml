name: Restore reviewed source images
on:
  push:
    branches: [develop]
    paths: ['.source-sync/images.json']
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python .source-sync/restore-images.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
